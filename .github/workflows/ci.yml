name: PySpark CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and PySpark Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      SPARK_LOCAL_IP: "127.0.0.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ruff linting
        run: uv run --locked ruff check .

      - name: Run PySpark smoke test
        run: uv run --locked python smoke_test.py

      - name: Configure ephemeral PostgreSQL credentials
        run: |
          echo "POSTGRES_USER=etl_lab" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=de_lab" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "POSTGRES_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "POSTGRES_PORT=55432" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify PostgreSQL source data
        run: |
          actual=$(docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc \
            "SELECT COUNT(*)::text || ':' || SUM(menge)::text FROM public.materialbewegungen;")
          test "$actual" = "4:45"

      - name: Run PostgreSQL JDBC ETL
        run: |
          uv run --locked python -m de_pyspark_lab.postgres_to_parquet \
            --result_path output/postgres_material_summary

      - name: Validate partitioned Parquet
        run: uv run --locked pytest -q tests/test_postgres_parquet.py

      - name: PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --tail=60 postgres

      - name: Remove ephemeral CI database
        if: always()
        run: docker compose down -v
